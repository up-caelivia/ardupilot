name: Build Pixhawk6C (Copter)

on:
  push:
    tags: [ "*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        board:
          - Pixhawk6C-UP
          - Pixhawk6C-UP-KUR500

    env:
      BOARD: ${{ matrix.board }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install prerequisites
        run: |
          sudo apt-get update
          DO_AP_STM_ENV=1 Tools/environment_install/install-prereqs-ubuntu.sh -y
          . ~/.profile || true

      - name: Configure and build
        shell: bash
        run: |
          sh ./UP/lua-script/copyScripts.sh KUR500 libraries/AP_HAL_ChibiOS/hwdef/Pixhawk6C-UP-KUR500/scripts
          source ~/.bashrc || true
          source ~/.profile || true
          export PATH=/opt/gcc-arm-none-eabi-10-2020-q4-major/bin:$PATH
          export PATH=$PWD/Tools/autotest:$PATH
          ./waf distclean || true
          ./waf configure --board "$BOARD"
          ./waf copter

      - name: Extract APJ + _with_bl.hex
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out

          APJ=$(find "build/${BOARD}" -type f -name "*.apj" | head -n 1)
          HEX=$(find "build/${BOARD}" -type f -name "*bl.hex" | head -n 1)

          cp "$APJ" "out/arducopter-${BOARD}-${{ github.ref_name }}.apj"
          cp "$HEX" "out/arducopter-${BOARD}-${{ github.ref_name }}_with_bl.hex"

          ls -lah out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.ref_name }}-${{ matrix.board }}
          path: out/*
          if-no-files-found: error
